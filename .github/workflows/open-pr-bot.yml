name: open-pr-bot

on:
  workflow_dispatch:
    inputs:
      head:
        description: "Branch to merge (must be pushed already)"
        required: true
        type: string
      base:
        description: "Target branch"
        required: false
        type: string
        default: main
      title:
        required: true
        type: string
      body:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR via PR bot token
        env:
          GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          HEAD_BRANCH: ${{ inputs.head }}
          BASE_BRANCH: ${{ inputs.base }}
          PR_TITLE: ${{ inputs.title }}
          PR_BODY: ${{ inputs.body }}
        run: |
          set -e
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PR_BOT_TOKEN secret is required: PRs created with GITHUB_TOKEN never trigger CI, review or auto-approve workflows (GitHub anti-recursion). The PR would sit unmergeable, so refusing to open it." >&2
            exit 1
          fi
          owner_lc="${GITHUB_REPOSITORY%%/*}"; owner_lc="${owner_lc,,}"
          existing=$(gh pr list -R "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --limit 100 \
            --json url,headRepositoryOwner \
            --jq "(map(select(.headRepositoryOwner.login | ascii_downcase == \"$owner_lc\")) + .) | .[0].url // empty")
          if [ -n "$existing" ]; then
            echo "PR already exists for $HEAD_BRANCH -> $BASE_BRANCH: $existing"
          else
            gh pr create -R "$GITHUB_REPOSITORY" \
              --head "$HEAD_BRANCH" --base "$BASE_BRANCH" \
              --title "$PR_TITLE" --body "$PR_BODY"
          fi
