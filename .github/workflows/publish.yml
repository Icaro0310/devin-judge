name: publish

# Builds the package and publishes to PyPI via the reusable workflow in
# devin-powerups. Requires repo secret PYPI_API_TOKEN.
# Triggers: publishing a GitHub Release, or manual Actions dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      id-token: write  # passed through to the reusable job for OIDC
    uses: Icaro0310/devin-powerups/.github/workflows/pypi-publish.yml@main
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
