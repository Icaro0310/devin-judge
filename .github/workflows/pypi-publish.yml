name: publish

# Publishes to PyPI via Trusted Publishing (OIDC): the publisher registered on
# PyPI expects job_workflow_ref == <this repo>/.github/workflows/pypi-publish.yml,
# so the upload job must live in this file (not a reusable workflow).
# Env "pypi" must exist. OIDC only — no PYPI_API_TOKEN fallback (an
# account-scoped token can upload to any project; do not reintroduce one).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Wheel __version__ gate lives in one place — verified before publish runs.
  verify:
    uses: Icaro0310/devin-powerups/.github/workflows/verify-wheel-version.yml@e2612c9e448a366a0539ea4593f70da47b4cec80 # v1
    with:
      package-dir: .
      module: poordjaevin
      python-version: "3.12"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      # Ship the exact dist/ that passed the verify gate — no second build.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      # Supply-chain guard: refuse to upload when the publish origin is
      # not merged into main (dispatch/release from unmerged branches once
      # desynced the index elsewhere in the ecosystem).
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # No password: a set token disables Trusted Publishing (OIDC).
          skip-existing: true
