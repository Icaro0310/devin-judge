name: publish

# Publishes to PyPI via Trusted Publishing (OIDC): the publisher registered on
# PyPI expects job_workflow_ref == <this repo>/.github/workflows/pypi-publish.yml,
# so the upload job must live in this file (not a reusable workflow).
# Env "pypi" must exist; PYPI_API_TOKEN repo secret remains as fallback.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Wheel __version__ gate lives in one place — verified before publish runs.
  verify:
    uses: Icaro0310/devin-powerups/.github/workflows/verify-wheel-version.yml@v1
    with:
      package-dir: .
      module: poordjaevin
      python-version: "3.12"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      # Supply-chain guard: refuse to upload when the publish origin is
      # not merged into main (dispatch/release from unmerged branches once
      # desynced the index elsewhere in the ecosystem).
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
