name: publish

# Publishes to PyPI via Trusted Publishing (OIDC): the publisher registered on
# PyPI expects job_workflow_ref == <this repo>/.github/workflows/pypi-publish.yml,
# so the upload job must live in this file (not a reusable workflow).
# Env "pypi" must exist; PYPI_API_TOKEN repo secret remains as fallback.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel self-reports pyproject version
        env:
          PKG: poordjaevin
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test -n "$ver"
          pip install --no-cache-dir --target /tmp/verchk dist/*.whl
          VER="$ver" python -c "import importlib, os, sys; sys.path.insert(0, '/tmp/verchk'); m = importlib.import_module('$PKG'); assert getattr(m, '__version__', None) == os.environ['VER'], f'wheel __version__ {getattr(m, \"__version__\", None)} != pyproject {os.environ[\"VER\"]}'"
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
