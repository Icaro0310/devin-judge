name: release-judge

# Extension + wheel release for the judge package — this repo ships both
# artifacts under one version (pyproject 0.1.2 == adapters/vscode 0.1.2).
# Tag `vX.Y.Z` mints the GitHub release with the packaged .vsix and fans
# out to the reusable release.yml@v1: detect finds the wheel (verify gate
# runs; the PyPI upload itself still belongs to pypi-publish.yml via its
# job_workflow_ref binding and skips here) → vscode-ext lint → vsce →
# VS Code Marketplace (Entra OIDC) → Open VSX (OVSX_PAT).
#
# Marketplace: needs federated credential `gh-devin-judge-release` on the
# devin-vscode-marketplace app registration (subject
# repo:Icaro0310/devin-judge:environment:release) — the Azure login step
# fails loudly until it exists.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pypi-publish.yml after the release — see below

jobs:
  # Shared prerequisite: a mistagged bare `vX.Y.Z` must fail HERE, before
  # either the release job or the fan-out publishes anything. `release`
  # and `fanout` both declare `needs: validate`, so an extension can
  # never ship under a label that disagrees with the manifests.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Bare `vX.Y.Z` convention — the manifest and pyproject must agree
      # (lockstep is also enforced by the reusable lint on the fanout leg).
      - name: Check tag matches manifest versions
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          got_ext=$(python3 -c "import json; print(json.load(open('adapters/vscode/package.json'))['version'])")
          got_wheel=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$want" != "$got_ext" ] || [ "$want" != "$got_wheel" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' ($want) vs package.json $got_ext / pyproject $got_wheel"
            exit 1
          fi

  release:
    needs: validate
    # GitHub release creation stays tag-only — a dispatch proves the
    # fan-out legs without minting a release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build and package the extension
        working-directory: adapters/vscode
        run: |
          npm ci
          npm run build
          npm run vscode:package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: a rerun after a partial failure uploads over the
          # existing release instead of dying on `gh release create`.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              adapters/vscode/judge.vsix --clobber
          else
            gh release create "$RELEASE_TAG" \
              adapters/vscode/judge.vsix \
              --verify-tag --generate-notes
          fi

      # `gh release create` with GITHUB_TOKEN does NOT emit a
      # `release.published` event — GitHub blocks recursive workflow
      # triggers from the same token — so pypi-publish.yml would never
      # fire on its own and the PyPI leg would be silently lost.
      # Dispatch it explicitly on the tag instead.
      - name: Trigger PyPI publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run pypi-publish.yml --ref "$RELEASE_TAG"

  fanout:
    needs: validate
    # Every scope the reusable requests must be granted here — a
    # missing scope fails the whole run at startup_failure.
    permissions:
      contents: read
      id-token: write   # Entra OIDC + cosign keyless
      packages: write   # docker leg scope
    uses: Icaro0310/devin-powerups/.github/workflows/release.yml@v1
    # Explicit mapping, not `inherit`: forwards only the Open VSX token.
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    with:
      package-dir: .
      pypi-environment: pypi
      vscode-ext-dir: adapters/vscode
