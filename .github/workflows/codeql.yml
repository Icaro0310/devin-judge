name: CodeQL

# Thin caller: the analyze job lives in the control plane
# (Icaro0310/devin-powerups/.github/workflows/codeql.yml @v1).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 3 * * 5"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Icaro0310/devin-powerups/.github/workflows/codeql.yml@v1
