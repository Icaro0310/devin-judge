# Auto-labels PRs by changed paths. Used by .github/workflows/labeler.yml
# (actions/labeler v5 config format).

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/pyproject.toml"
          - "**/requirements*.txt"
          - "**/uv.lock"
          - "**/package.json"
          - "**/package-lock.json"
          - "**/go.mod"
          - "**/go.sum"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
