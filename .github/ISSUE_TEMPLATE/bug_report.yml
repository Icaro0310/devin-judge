name: Bug report
description: Report a reproducible problem with poordjaevin
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      description: The version you installed (for example `0.3.1`), or the install command you used
      placeholder: "e.g. 0.3.1"
    validations:
      required: true
  - type: input
    id: devin-cli
    attributes:
      label: Devin CLI version
      description: Output of `devin --version`, if the issue involves a Devin session or store
      placeholder: "leave empty if not relevant"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command(s) you ran and what happened
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste the relevant output or error text
      render: text
