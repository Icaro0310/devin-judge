[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poordjaevin"
version = "0.1.1"
description = "A local-first typed decision layer with calibrated confidence, including an optional Devin ACP backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Icaro0310" }]
keywords = ["llm", "classification", "calibration", "system-one", "structured-output", "conformal-prediction", "zero-shot", "guardrails", "mcp"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
local = ["transformers>=4.40", "torch>=2.2", "sentencepiece>=0.2", "protobuf>=4.0"]
llm = ["anthropic>=0.40", "openai>=1.40"]
plots = ["matplotlib>=3.8", "numpy>=1.26"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
poordjaevin = "poordjaevin.cli:main"

[project.urls]
Source = "https://github.com/Icaro0310/poordjaevin"
Upstream = "https://github.com/rupeshpoojary9/poorjev"

[tool.hatch.build.targets.wheel]
packages = ["src/poordjaevin"]

[tool.hatch.build.targets.wheel.force-include]
"src/poordjaevin/scripts/djaevin-acp-bridge.mjs" = "poordjaevin/scripts/djaevin-acp-bridge.mjs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
